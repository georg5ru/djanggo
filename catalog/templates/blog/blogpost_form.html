{% extends 'catalog/base.html' %}

{% block title %}{% if object %}Редактирование статьи{% else %}Создание статьи{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h1 class="mb-4">{% if object %}✏️ Редактирование статьи{% else %}➕ Создание статьи{% endif %}</h1>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                {{ form.as_p }}
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">💾 Сохранить</button>
                <a href="{% if object %}{% url 'blog:blogpost_detail' object.pk %}{% else %}{% url 'blog:blogpost_list' %}{% endif %}"
                   class="btn btn-secondary">❌ Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
