{% extends 'catalog/base.html' %}

{% block title %}Удаление продукта{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-4">🗑️ Удаление продукта</h1>

        <div class="alert alert-warning">
            <p>Вы уверены, что хотите удалить продукт "<strong>{{ object.name }}</strong>"?</p>
            <p class="mb-0"><small>Это действие нельзя отменить.</small></p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">🗑️ Удалить</button>
                <a href="{% url 'product_detail' object.pk %}" class="btn btn-secondary">❌ Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
